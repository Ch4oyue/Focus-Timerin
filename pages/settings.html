<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan - Focus Timerin</title>
  <meta name="description" content="Sesuaikan durasi fokus, volume suara, dan tema aplikasi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/images/pomodoro.png" type="image/png">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script type="module" src="../assets/js/settings.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar surface" aria-label="Navigasi utama">
      <div class="navbar__brand">
        <img src="../assets/images/pomodoro.png" alt="Logo Focus Timerin">
        <span>Focus Timerin</span>
      </div>
      <button class="icon-button navbar__toggle" data-menu-toggle aria-expanded="false" aria-label="Buka menu">☰</button>
      <ul class="navbar__links" data-nav-links>
        <li><a class="navbar__link" href="../index.html">Beranda</a></li>
        <li><a class="navbar__link" href="history.html">Riwayat</a></li>
        <li><a class="navbar__link" href="settings.html">Pengaturan</a></li>
        <li><a class="navbar__link" href="about.html">Tentang</a></li>
        <li><a class="navbar__link" href="profile.html">Profil</a></li>
      </ul>
      <div class="navbar__actions">
        <button class="icon-button" data-theme-toggle aria-label="Ganti tema">☾</button>
      </div>
    </nav>
  </header>

  <main class="main-wrapper">
    <header class="page-section">
      <h1 class="page-title">Pengaturan</h1>
      <p class="page-subtitle">Atur durasi sesi, volume suara, serta tampilan sesuai gaya kerjamu.</p>
    </header>

    <form id="settingsForm" class="surface settings-form">
      <section>
        <h2>Durasi timer</h2>
        <div class="settings-grid">
          <label class="form-control" for="focusDuration">
            <span>Fokus (menit)</span>
            <input type="number" id="focusDuration" min="1" max="180" required>
          </label>
          <label class="form-control" for="shortBreakDuration">
            <span>Istirahat pendek (menit)</span>
            <input type="number" id="shortBreakDuration" min="1" max="60" required>
          </label>
          <label class="form-control" for="longBreakDuration">
            <span>Istirahat panjang (menit)</span>
            <input type="number" id="longBreakDuration" min="5" max="120" required>
          </label>
        </div>
      </section>

      <section>
        <h2>Suara &amp; notifikasi</h2>
        <div class="settings-grid">
          <label class="form-control" for="soundVolume">
            <span>Volume notifikasi</span>
            <input type="range" id="soundVolume" min="0" max="100" class="range-input">
          </label>
        </div>
      </section>

      <section>
        <h2>Tema aplikasi</h2>
        <div class="settings-grid">
          <label class="form-control">
            <span><input type="radio" name="theme" value="dark" checked> Mode gelap</span>
          </label>
          <label class="form-control">
            <span><input type="radio" name="theme" value="light"> Mode terang</span>
          </label>
        </div>
      </section>

      <div class="task-summary">
        <button class="btn btn-primary" type="submit">Simpan</button>
        <button class="btn btn-secondary" type="button" id="resetSettings">Reset default</button>
      </div>
    </form>
  </main>

  <footer class="footer">© <span id="year"></span> Focus Timerin.</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
